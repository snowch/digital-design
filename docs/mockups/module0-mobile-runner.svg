<title id="title">Proposed mobile program runner: three instruction window with change summary</title>
<desc id="desc">An illustrative dark mode layout with a small instruction window, highlighted instruction 3, Show all and Browse controls, run controls, and a What changed summary. This is a visual design only, not real application state.</desc>
