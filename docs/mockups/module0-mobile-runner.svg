<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1295" viewBox="0 0 1140 1295" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Revised Module 0 mobile program runner mockup: full program by default, follow execution optional</title>
<desc id="svg-desc">Two dark-mode mobile mockups. Left: all nine instructions visible by default with instruction number in the same row as its complete text; instruction 6 wraps within the text column. Right: optional Follow execution mode shows instructions 2, 3 and 4. Both show 3 next to execute and R2 updated to minus 250 after instruction 2. The drawings are illustrative layouts, not live simulation.</desc>
