name: Real tools

# The course's SystemVerilog, through Verilator and Yosys (docs/simulator.md, "Real tools").
# Separate from the check so that it runs on main only and `npm run check` needs no extra install.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  real-tools:
    # Pinned: the Verilator that apt installs, and so its warnings, belong to the image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Dependencies, exactly as the lockfile says
        run: npm ci

      - name: Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Yosys, at the version requirements.txt pins
        run: pip install -r scripts/real-tools/requirements.txt

      - name: Collect, lint, synthesise, simulate
        run: ./scripts/real-tools/check.sh
