<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Copyright © 2026 Christopher Snow -->
  <!-- The course's icon, chosen by the author on 7 October 2026: an AND gate on the cover's blue
       (tokens.css, hero-bg-1 to hero-bg-2), its leads in the cover's light blue (hero-sub). The
       gate keeps within 24 units of the centre, inside the circle a phone's mask leaves. The PNGs
       beside this file are drawn from it by scripts/icons.mjs, which squares off its corners for
       the icons a phone shapes itself. -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4fa3" />
      <stop offset="1" stop-color="#0e2758" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cover)" />
  <path d="M10 25h12M10 39h12M44 32h10" stroke="#a9d4ff" stroke-width="4" stroke-linecap="round" />
  <path d="M21 17h10a15 15 0 0 1 0 30H21z" fill="#ffffff" />
</svg>
